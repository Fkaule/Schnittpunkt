<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schnittpunkt: Wäscheleine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Stencil:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">Schnittpunkt</h1>
    <p class="claim">Station 3: Wäscheleine. Eine Leine mit Gewichten hängt genau so, wie die Momentenlinie des Trägers verläuft.</p>
    <div class="nav">
      <nav class="stations" aria-label="Station wählen"><a href="index.html">1 Festhalten</a><a href="spur.html">2 Säge-Spur</a><a href="leine.html" aria-current="page">3 Wäscheleine</a></nav>
      <nav class="levels" id="levels" aria-label="Level wählen"></nav>
    </div>
  </header>

  <main class="stage">
    <section class="sheet" aria-label="Zeichnung">
      <p class="howto" id="howto"></p>
      <div class="canvas-wrap" id="wrap">
        <canvas id="cv" aria-label="Träger mit Lasten, darunter eine Wäscheleine mit denselben Lasten"></canvas>
        <div class="stamp" id="stamp" hidden></div>
      </div>
      <ul class="legend" aria-label="Legende">
        <li><i style="background: var(--cM)"></i>Leine = Momentenlinie M, positiv nach unten</li>
        <li><i style="background: var(--accent)"></i>Ihre Vorhersage</li>
        <li><i style="background: var(--react)"></i>Lagerkraft</li>
        <li><i style="background: var(--ink)"></i>Last</li>
      </ul>
    </section>

    <aside class="side">
      <table class="titleblock" aria-label="Schriftfeld">
        <tbody>
          <tr><th>Level</th><td id="tb-name"></td></tr>
          <tr><th>Aufgabe</th><td class="txt" id="tb-task"></td></tr>
          <tr><th>Ergebnis</th><td id="tb-res"></td></tr>
          <tr><th>Sterne</th><td class="big" id="tb-stars"></td></tr>
        </tbody>
      </table>
      <div class="actions">
        <button type="button" class="btn primary" id="b-main">Loslassen</button>
        <button type="button" class="btn" id="b-tip">Tipp</button>
        <button type="button" class="btn" id="b-alt">Nochmal</button>
      </div>
      <div class="verdict" id="verdict" aria-live="polite"></div>
    </aside>
  </main>
</div>
<script src="src/mech.js"></script>
<script src="src/draw.js"></script>
<script src="src/leine-levels.js"></script>
<script src="src/leine.js"></script>
</body>
</html>
